{{- if .Values.ssl.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "metabase.fullname" . }}-ssl
  namespace:  {{ template "metabase.namespace" . }}
  labels:
    app: {{ template "metabase.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- with include "metabase.commonLabels" . }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  keystore: {{ .Values.ssl.keyStore | default .Values.ssl.keystore | required "ssl.keyStore is required when ssl.enabled is true" | b64enc | quote }}
  password: {{ .Values.ssl.keyStorePassword | required "ssl.keyStorePassword is required when ssl.enabled is true" | b64enc | quote }}
{{- end }}
